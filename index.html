{b:"Bloc 2 · Cadre de vie et projet",id:"str",t:"c",q:"Qu'est-ce qui t'inquiète le plus à l'idée de vivre à l'étranger ?",o:["La barrière de la langue","Me sentir seul(e) ou ne pas m'intégrer","L'argent et le coût de la vie","La sécurité","Le climat et le manque de lumière","Les démarches et la recherche de logement","Être loin de ma famille et de la France"]},
{b:"Bloc 2 · Cadre de vie et projet",id:"cul",t:"m",q:"Dans quel type d'organisation veux-tu faire ton stage ?",o:["Startup","Petite entreprise familiale","PME / entreprise de taille moyenne","Grande entreprise / multinationale","Organisme public / centre de recherche / ONG"]},
{b:"Bloc 2 · Cadre de vie et projet",id:"hs",t:"c",q:"Où aimerais-tu vivre ?",o:["Colocation","Résidence étudiante","Studio ou appartement individuel"]},
...SL.map(s=>({b:"Bloc 3 · "+({A:"Conditions économiques et logistiques",B:"Climat, bien-être et culture",C:"Société, inclusion et droits",D:"Carrière professionnelle"})[s[4]],id:s[0],t:"r",q:s[1],h:s[2],tg:s[5]}))];
const STR={0:[],1:[11,6],2:[0],3:[7],4:[3,4],5:[2,23],6:[1,21]};
const A={lang:{}};let i=0;const $=document.getElementById("app");
const LV=["Aucun","A1–A2","B1–B2","C1–C2"],LN={fr:"Français",en:"Anglais",es:"Espagnol",de:"Allemand",it:"Italien",nl:"Néerlandais",pt:"Portugais",ja:"Japonais",zh:"Chinois",ko:"Coréen",ar:"Arabe"};
function ans(q){return q.t=="m"?(A[q.id]||[]).length>0:q.t=="l"?1:q.t=="r"?1:A[q.id]!==undefined}
function render(){
 if(i>=Q.length)return result();
 const q=Q[i];let h=`<h1>🌍 Mon stage dans le monde</h1><div class="mu">Question ${i+1} sur ${Q.length}</div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="card"><span class="blk">${q.b}</span><h2>${typeof q.q=="function"?q.q():q.q}</h2>`;
 if(q.t=="y")h+=["si","no"].map(v=>`<button class="opt ${A[q.id]==v?"on":""}" onclick="set('${q.id}','${v}')">${v=="si"?"Oui":"Non"}</button>`).join("");
 if(q.t=="c")h+=q.o.map((o,k)=>`<button class="opt ${A[q.id]===k?"on":""}" onclick="set('${q.id}',${k})">${o}</button>`).join("");
 if(q.t=="m")h+=q.o.map((o,k)=>`<button class="opt ${(A[q.id]||[]).includes(k)?"on":""}" onclick="tg('${q.id}',${k})">${o}</button>`).join("")+`<p class="mu">Plusieurs choix possibles</p>`;
 if(q.t=="s")h+=`<select onchange="set('${q.id}',this.value)"><option value="" disabled ${A[q.id]?"":"selected"}>Choisis une option…</option>${(typeof q.o=="function"?q.o():q.o).map(o=>`<option value="${o[0]}" ${A[q.id]==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select>`;
 if(q.t=="l")h+=Object.keys(LN).map(l=>`<div class="lg"><b>${LN[l]}</b><select onchange="A.lang['${l}']=+this.value">${LV.map((v,k)=>`<option value="${k}" ${(A.lang[l]||0)==k?"selected":""}>${v}</option>`).join("")}</select></div>`).join("");
 if(q.t=="r"){const v=A[q.id]??5;h+=`<p class="mu">${q.h}</p><div class="big" id="v">${v}</div><input type="range" min="1" max="10" value="${v}" oninput="A['${q.id}']=+this.value;document.getElementById('v').textContent=this.value"><div class="sc">${q.tg?"<span>1 · Minimum</span><span>10 · Maximum</span>":"<span>1 · Pas important</span><span>10 · Indispensable</span>"}</div>`}
 h+=`</div><div class="row">${i?`<button class="btn g" onclick="nx(-1)">← Retour</button>`:""}<button class="btn" ${ans(q)?"":"disabled"} onclick="nx(1)">${i==Q.length-1?"Voir les résultats":"Suivant →"}</button></div>`;
 $.innerHTML=h}
function nx(d){i+=d;while(Q[i]&&Q[i].sk&&Q[i].sk())i+=d;render();scrollTo(0,0)}
function tg(k,v){const a=A[k]||[];A[k]=a.includes(v)?a.filter(x=>x!=v):a.concat(v);render()}
function set(k,v){A[k]=v;if(k=="orig")delete A.ocu;if(k=="orig"&&v==0&&A.lang.fr===undefined)A.lang.fr=3;render()}
function result(){
 const dur=A.dur,sec=(SEC[A.field]||"").split(" ");
 const P={};SL.forEach(s=>P[s[0]]=A[s[0]]??5);
 const out=[],ok=[];
 C.forEach(([code,name,fl,ls,m,xx])=>{
  const known=ls.some(l=>(A.lang[l]||0)>=2);let x=null;
  if(!known&&A.q5=="no"&&!(A.q6=="si"&&m[12]>=7))x="Tu ne parles pas la langue locale et l'anglais professionnel y est insuffisant";
  else if(A.q7=="si"&&!SCH.includes(code))x="Hors espace Schengen";
  else if(A.q8=="si"&&dur>0&&m[13]<4)x="Stages peu ou pas rémunérés";
  else if(m[0]<[8,6,4,3,1,0][A.q9])x="Coût de la vie supérieur à ton budget";
  else if(A.d1=="si"&&xx[5]==2)x="Visa ou permis de travail complexe exigé";
  else if(A.d2=="si"&&xx[1]>6)x="À plus de 6 h de vol de la France";
  else if(A.d3=="si"&&Math.abs(xx[0])>3)x="Décalage horaire supérieur à 3 h";
  if(x){out.push([name,fl,x]);return}
  const cr=SL.map(s=>{let w=P[s[0]]**2*G[s[4]],f=m[s[3]];if(s[0]=="food")f=sim(A.orig===0?"fr":(FAM[A.ocu]||A.ocu||"fr"),FAM[code]);if(s[0]=="pay")w*=.4;if(s[5])return{n:s[1],v:7,f:10-Math.abs(P[s[0]]-f),w:45*G[s[4]]};
   if(s[0]=="jobs"&&sec.includes(code))f=Math.min(10,f+2);
   if(s[0]=="cost"&&P.cost>=8||0)0;
   if(s[0]=="hous"&&P.cost>=8)w*=1.3;
   if(s[0]=="stab"&&(P.wom>=8||P.lgbt>=8))w*=1.3;
   if(s[0]=="pay"&&dur==2)w*=1.3;
   if(s[0]=="prox"&&dur==0)w*=1.3;
   if((STR[A.str]||[]).includes(s[3]))w*=1.5;
   return{n:s[1],v:P[s[0]],f,w}});
  const ex=[];
  if(A.env&&A.env.length)ex.push({n:"Cadre de vie",f:Math.max(...A.env.map(k=>[m[28],m[15],m[16],(10-m[28]+m[16])/2,m[17],(m[17]+10-m[28])/2][k])),w:45});
  if(A.cul&&A.cul.length)ex.push({n:"Type d'organisation",f:Math.max(...A.cul.map(k=>[m[18],(m[18]+10-m[19])/2,(m[18]+m[19])/2,m[19],m[20]][k])),w:45});
  if(A.hs!==undefined)ex.push({n:"Type de logement choisi",f:m[24+A.hs],w:50});
  ex.push({n:"Aisance linguistique",f:known?10:m[12],w:A.str==0?60:20});
  const all=cr.concat(ex.map(e=>({...e,v:e.w>=40?6:5})));
  let S=all.reduce((a,c)=>a+c.w*c.f,0)/(10*all.reduce((a,c)=>a+c.w,0));
  const bad=all.filter(c=>c.v>=8&&c.f<=3);if(bad.length)S*=.8;
  if(P.prox>=8&&m[1]<5)S*=.9;
  if(!known&&A.q6=="no")S*=.85;
  ok.push({name,fl,S,good:all.filter(c=>c.v>=7&&c.f>=7).sort((a,b)=>b.w*b.f-a.w*a.f).slice(0,3).map(c=>c.n),bad:bad.map(c=>c.n)})});
 ok.sort((a,b)=>b.S-a.S);const mx=ok[0]?.S||1;
 const pc=o=>Math.round(Math.min(99,o.S/mx*100*.9+(o.S*10)));
 let h=`<h1>🌍 Tes résultats</h1><p class="mu">${ok.length} pays compatibles · ${out.length} écartés par tes filtres</p>`;
 if(!ok.length)h+=`<div class="card">Tes filtres éliminatoires écartent toutes les destinations. Essaie d'en assouplir un (langue, budget ou rémunération).</div>`;
 ok.slice(0,3).forEach((o,k)=>{const p=Math.min(98,Math.round(o.S*100*1.15));h+=`<div class="card"><div class="top"><span>${["🥇","🥈","🥉"][k]} ${o.fl} ${o.name}</span><span>${p}%</span></div><div class="pc"><i style="width:${p}%"></i></div>${o.good.length?`<div class="ok">✔ Points forts :</div><ul>${o.good.map(g=>`<li>${g}</li>`).join("")}</ul>`:""}${o.bad.length?`<div class="wa">⚠ Ne respecte pas tes critères non négociables :</div><ul>${o.bad.map(g=>`<li>${g}</li>`).join("")}</ul>`:""}</div>`});
 if(ok.length>3)h+=`<details><summary>Voir le reste du classement (${ok.length-3})</summary>${ok.slice(3).map(o=>`<div class="li"><span>${o.fl} ${o.name}</span><b>${Math.min(98,Math.round(o.S*115))}%</b></div>`).join("")}</details>`;
 if(out.length)h+=`<details><summary>Pays écartés (${out.length})</summary>${out.map(o=>`<div class="li"><span>${o[1]} ${o[0]}</span><span class="ko" style="text-align:right;max-width:60%">${o[2]}</span></div>`).join("")}</details>`;
 h+=`<p class="mu" style="margin-top:16px">Comment c'est calculé : 1) les filtres du Bloc 1 éliminent des pays ; 2) chaque note de 1 à 10 est élevée au carré pour que les 8–10 pèsent beaucoup plus, puis multipliée par l'importance de sa catégorie (droits et sécurité ×1,25 ; économie et carrière ×1,15) ; 3) les réponses sont reliées entre elles (ex. si le coût de la vie bas est prioritaire, le logement pèse plus ; ta principale inquiétude renforce les critères associés) ; 4) un critère non négociable (9–10) non respecté pénalise le pays. Les scores par pays sont des estimations indicatives. Vérifie toujours les conseils aux voyageurs de France Diplomatie et que ton université a une convention avec la destination.</p><div class="row"><button class="btn" onclick="i=0;render()">Refaire le test</button></div>`;
